blurb: >
  The bottle that invented the single-barrel category and still trades largely on its
  horse-stopper cork and its scarcity. The whiskey itself is genuinely good — honeyed and
  citrus-led with nutmeg spice — but at secondary prices you are paying for the bottle as much
  as the pour.
verdict: >
  the original single-barrel presentation and a honeyed, citrus-led profile, and the hunt is
  part of the appeal
